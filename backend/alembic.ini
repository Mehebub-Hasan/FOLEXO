# FOLEXO — Alembic configuration
#
# The database URL is NOT stored here. env.py resolves it from app.core.config
# (POSTGRES_URL environment variable / .env file) so credentials live in one
# place only. Run migrations from backend/: `alembic upgrade head`.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# Produces: <rev-id>_<slug>.py, e.g. 0002_add_indexes.py
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

# Placeholder — always overridden in alembic/env.py from application settings.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
