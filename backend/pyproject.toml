[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folexo-backend"
version = "0.1.0"
description = "FOLEXO (Invoice AI) backend — FastAPI modular monolith"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "SQLAlchemy>=2.0",
    "asyncpg>=0.29",
    "greenlet>=3.0",          # required by SQLAlchemy's async extension
    "alembic>=1.13",
    "arq>=0.26",              # async task queue over Redis (ADR-002)
    "PyJWT>=2.8",
    "cryptography>=42",       # JWT backend for PyJWT (asymmetric keys in later phases)
    "python-multipart>=0.0.9", # multipart/form-data parsing
    "httpx>=0.27",            # async HTTP client (Supabase Storage signed upload URLs)
    "azure-ai-documentintelligence>=1.0",  # Stage A extraction (ADR-003)
    "openai>=1.40",           # Stage B conditional fallback (ADR-003)
    "openpyxl>=3.1",          # XLSX financial exports (Phase 6) (invoice upload)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",            # required by fastapi.testclient / AsyncClient
    "aiosqlite>=0.20",        # in-process DB for the test suite (no local Postgres)
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
